<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography - Ryovann</title>
    <link href="https://fonts.googleapis.com/css2?family=Impact&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="web portofolio.css">
    <style>
        .detail-container { padding-top: clamp(80px, 15vh, 120px); text-align: center; padding-bottom: 60px; }
        .back-btn { display: inline-block; margin-bottom: 30px; color: var(--accent-red); text-decoration: none; font-weight: 500; }
        .project-info { max-width: 700px; margin: 0 auto 40px auto; text-align: justify; font-size: clamp(0.95rem, 1.2vw, 1.1rem); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="gambar/logo ryovan.png" alt="Logo"> <span>Ryovannn</span>
        </div>
        <ul class="nav-links">
            <li><a href="website portofolio.html#project">Kembali</a></li>
        </ul>
    </nav>

    <main class="container detail-container">
        <a href="website portofolio.html#project" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali ke Galeri</a>
        <h1 class="block-title">Photography</h1>
        <div class="project-info">
            <p>Kumpulan momen yang diabadikan melalui lensa kamera. Menampilkan keindahan sudut pandang, pencahayaan alami, dan cerita di balik setiap bingkai foto.</p>
        </div>

        <div class="project-gallery">
            <div class="gallery-item"><img src="LINK_KARYA_7" onerror="gambar/IMG-20260318-WA0032(1).jpg"></div>
            <div class="gallery-item"><img src="LINK_KARYA_7" onerror="gambar/IMG_0031 (1).jpg"></div>
            <div class="gallery-item"><img src="LINK_KARYA_7" onerror="gambar/IMG_0111 (1).jpg"></div>
            <div class="gallery-item"><img src="LINK_KARYA_7" onerror="gambar/IMG_0175 (1).jpg"></div>
            <div class="gallery-item"><img src="LINK_KARYA_7" onerror="gambar/IMG_20250514_133609_224 (2).dng"></div>
            <div class="gallery-item"><img src="LINK_KARYA_7" onerror="gambar/IMG_20250902_140203_298.dng"></div>
            <div class="gallery-item"><img src="LINK_KARYA_7" onerror="this.src='https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=400'"></div>
            <div class="gallery-item"><img src="LINK_KARYA_8" onerror="this.src='https://images.unsplash.com/photo-1542038784456-1ea8e935640e?q=80&w=400'"></div>
            <div class="gallery-item"><img src="LINK_KARYA_9" onerror="this.src='https://images.unsplash.com/photo-1551316679-9c6ae9dec224?q=80&w=400'"></div>
        </div>
    </main>

    <div id="imageModal" class="modal" onclick="this.style.display='none'">
        <img class="modal-content" id="imgFull">
    </div>

    <script>
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("imgFull");
        const items = document.querySelectorAll(".gallery-item img");
        items.forEach(img => {
            img.addEventListener("click", () => {
                modal.style.display = "flex";
                modalImg.src = img.src;
            });
        });
    </script>
</body>
</html>
