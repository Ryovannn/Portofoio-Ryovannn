<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic Design - Ryovann</title>
    <link href="https://fonts.googleapis.com/css2?family=Impact&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="web portofolio.css">
    <style>
        .detail-container { padding-top: clamp(80px, 15vh, 120px); text-align: center; padding-bottom: 60px; }
        .back-btn { display: inline-block; margin-bottom: 30px; color: var(--accent-red); text-decoration: none; font-weight: 500; }
        .project-info { max-width: 700px; margin: 0 auto 40px auto; text-align: justify; font-size: clamp(0.95rem, 1.2vw, 1.1rem); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="gambar/logo ryovan.png" alt="Logo"> <span>Ryovannn</span>
        </div>
        <ul class="nav-links">
            <li><a href="website portofolio.html#project">Kembali</a></li>
        </ul>
    </nav>

    <main class="container detail-container">
        <a href="website portofolio.html#project" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali ke Galeri</a>
        <h1 class="block-title">Graphic Design</h1>
        <div class="project-info">
            <p>Portofolio desain grafis untuk berbagai kebutuhan visual seperti poster, layout, dan konten media sosial yang komunikatif serta estetik.</p>
        </div>

        <div class="project-gallery">
            <div class="gallery-item"><img src="LINK_KARYA_1" onerror="this.src='https://i1-c.pinimg.com/736x/ba/e0/96/bae0968750eeff435f7032b5f7c8426b.jpg'"></div>
            <div class="gallery-item"><img src="LINK_KARYA_2" onerror="this.src='https://i1-c.pinimg.com/736x/01/1d/99/011d99905272445839446d3301072d73.jpg'"></div>
            <div class="gallery-item"><img src="LINK_KARYA_3" onerror="this.src='https://i1-c.pinimg.com/736x/87/1c/64/871c642646b96574a441312521990472.jpg'"></div>
            <div class="gallery-item"><img src="LINK_KARYA_4" onerror="this.src='https://i1-c.pinimg.com/736x/c5/4a/07/c54a0709405626027a202c6109968412.jpg'"></div>
            <div class="gallery-item"><img src="LINK_KARYA_5" onerror="this.src='https://i1-c.pinimg.com/736x/77/81/79/77817929426f4998782012c4d682496a.jpg'"></div>
            <div class="gallery-item"><img src="LINK_KARYA_6" onerror="this.src='https://i1-c.pinimg.com/736x/ba/e0/96/bae0968750eeff435f7032b5f7c8426b.jpg'"></div>
            <div class="gallery-item"><img src="LINK_KARYA_7" onerror="this.src='https://i1-c.pinimg.com/736x/01/1d/99/011d99905272445839446d3301072d73.jpg'"></div>
            <div class="gallery-item"><img src="LINK_KARYA_8" onerror="this.src='https://i1-c.pinimg.com/736x/87/1c/64/871c642646b96574a441312521990472.jpg'"></div>
            <div class="gallery-item"><img src="LINK_KARYA_9" onerror="this.src='https://i1-c.pinimg.com/736x/c5/4a/07/c54a0709405626027a202c6109968412.jpg'"></div>
        </div>
    </main>

    <div id="imageModal" class="modal" onclick="this.style.display='none'">
        <img class="modal-content" id="imgFull">
    </div>

    <script>
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("imgFull");
        const items = document.querySelectorAll(".gallery-item img");
        items.forEach(img => {
            img.addEventListener("click", () => {
                modal.style.display = "flex";
                modalImg.src = img.src;
            });
        });
    </script>
</body>
</html>
