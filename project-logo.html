<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Design - Ryovann</title>
    <link href="https://fonts.googleapis.com/css2?family=Impact&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="web portofolio.css">
    <style>
        .detail-container { padding-top: clamp(80px, 15vh, 120px); text-align: center; padding-bottom: 60px; }
        .back-btn { display: inline-block; margin-bottom: 30px; color: var(--accent-red); text-decoration: none; font-weight: 500; }
        .project-info { max-width: 700px; margin: 0 auto 40px auto; text-align: justify; font-size: clamp(0.95rem, 1.2vw, 1.1rem); }

        /* Pengaturan 6 kolom mendatar */
        .project-gallery {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px; /* Jarak antar foto */
            margin-top: 30px;
        }

        /* Penyesuaian untuk layar tablet dan HP agar tidak terlalu sempit */
        @media (max-width: 1024px) { .project-gallery { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { .project-gallery { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="gambar/logo ryovan.png" alt="Logo"> <span>Ryovannn</span>
        </div>
        <ul class="nav-links">
            <li><a href="website portofolio.html#project">Kembali</a></li>
        </ul>
    </nav>

    <main class="container detail-container">
        <a href="website portofolio.html#project" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali ke Galeri</a>
        <h1 class="block-title">Logo Design</h1>
        <div class="project-info">
            <p>Proses pembuatan identitas visual yang unik dan ikonik. Fokus pada filosofi bentuk, pemilihan tipografi, dan kemudahan pengenalan brand.</p>
        </div>

        <div class="project-gallery">
            <div class="gallery-item"><img src="LINK_KARYA_1" onerror="this.src='https://i1-c.pinimg.com/1200x/6a/f6/52/6af6524701a6a3f241e7f8bd814b4aab.jpg'"></div>
            <div class="gallery-item"><img src="LINK_KARYA_2" onerror="this.src='https://i1-c.pinimg.com/736x/8e/31/3d/8e313d40608553229606132470377488.jpg'"></div>
            <div class="gallery-item"><img src="LINK_KARYA_3" onerror="this.src='https://i1-c.pinimg.com/736x/7d/56/64/7d5664426543b5938f220317e0896005.jpg'"></div>
            <div class="gallery-item"><img src="LINK_KARYA_4" onerror="this.src='https://i1-c.pinimg.com/736x/43/66/14/4366144e05869480e668a6f3a743e49e.jpg'"></div>
            <div class="gallery-item"><img src="LINK_KARYA_5" onerror="this.src='https://i1-c.pinimg.com/736x/c5/4a/07/c54a0709405626027a202c6109968412.jpg'"></div>
            <div class="gallery-item"><img src="LINK_KARYA_6" onerror="this.src='https://i1-c.pinimg.com/1200x/6a/f6/52/6af6524701a6a3f241e7f8bd814b4aab.jpg'"></div>
            <div class="gallery-item"><img src="LINK_KARYA_7" onerror="this.src='https://i1-c.pinimg.com/736x/8e/31/3d/8e313d40608553229606132470377488.jpg'"></div>
            <div class="gallery-item"><img src="LINK_KARYA_8" onerror="this.src='https://i1-c.pinimg.com/736x/7d/56/64/7d5664426543b5938f220317e0896005.jpg'"></div>
            <div class="gallery-item"><img src="LINK_KARYA_9" onerror="this.src='https://i1-c.pinimg.com/1200x/6a/f6/52/6af6524701a6a3f241e7f8bd814b4aab.jpg'"></div>
        </div>
    </main>

    <div id="imageModal" class="modal" onclick="this.style.display='none'">
        <img class="modal-content" id="imgFull">
    </div>

    <script>
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("imgFull");
        const items = document.querySelectorAll(".gallery-item img");
        items.forEach(img => {
            img.addEventListener("click", () => {
                modal.style.display = "flex";
                modalImg.src = img.src;
            });
        });
    </script>
</body>
</html>
